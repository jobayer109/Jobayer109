name: Update contribution chart

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/contribution_chart.py]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/contribution_chart.py "${{ github.repository_owner }}" assets/contributions.svg

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain assets/contributions.svg)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/contributions.svg
            git commit -m "chore: refresh contribution chart"
            git push
          else
            echo "no change"
          fi
